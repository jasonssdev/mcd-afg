# OE1 annotation assignment -- who annotates what, in which phase.
#
# This file is the SINGLE SOURCE OF TRUTH for the split described in prose at
# docs/anotacion/asignacion/README.md. The prose explains *why* the split is what it is;
# this file is what `afg gold prepare`, `afg gold validate` and `afg gold status` actually
# read. When the two disagree, this file wins and the prose is the bug.
#
# Series ids must exist in config/corpus.toml [oe1].series. Initials are the ones fixed by
# CONTRIBUTING.md section 1 and used in every annotated filename.

[annotation]
# Who resolves disagreements after each double-annotated series. Design rule
# (CONTRIBUTING.md section 1): the adjudicator never annotates, so `jss` carries no series.
adjudicator = "jss"

# Phases are strictly sequential and shared by both annotators (asignacion/README.md
# section 2). Phase 1 calibrates on a development series that is already contaminated by
# the pilot, so a bad first kappa costs nothing; phase 2 is the four control series whose
# kappas are reported. Both are double-annotated; phase 3 is single annotation, split
# per person below.
#
# Phase 1 has TWO series. ES2015 gave a low status kappa (13/29 agree, kappa 0.094) because
# the manual had no threshold criterion, so the guide was revised and the calibration was
# repeated on TS3009 (a development series, no worked example in the manual, a different
# recording site) before any control series. Its kappa is diagnostic and is not reported;
# phase 2 waits for TS3009 to be adjudicated.
#
# EVERY series list in this file is in EXECUTION order, not alphabetical. `afg gold setup`
# prints them in this order and the annotator works down that list, so the order is an
# instruction, not a formatting choice. Phase 2 climbs 4 -> 8 -> 11 -> 14 candidate pairs:
# the annotator meets the cheapest control series first and the costliest last. Sorting
# these lists alphabetically hands them ES2008, the heaviest, on day one -- which is why
# tests/test_workspace.py pins the order by volume rather than by name.
phase1_series = ["ES2015", "TS3009"]
phase2_series = ["ES2016", "IS1003", "TS3005", "ES2008"]

[annotation.recall_sample]
# Tarea C (manual section 5): adjudicate a random sample of pairs the blocker REJECTED, to
# put a number on what it lost. One person, one sample per listed series: the original
# development series (IS1004) plus one evaluation series per recording site (ES2016, IS1003,
# TS3005), so recall can be reported per site and overall (professor feedback, avance 06
# section 2). `seed` and `n` are the arguments `afg gold recall-sample` was run with for each
# series, recorded here so every sample stays reproducible.
owner = "gv"
series = ["IS1004", "ES2016", "IS1003", "TS3005"]
n = 50
seed = 42

[annotation.question_bank]
# Thesis section 5.5 / OE4. Design rule (CONTRIBUTING.md section 1): whoever writes the
# bank does not validate it.
author = "gm"
validator = "gv"
# Rows the bank holds per stratum (the total, 115, is derived). 25 is the preregistered
# minimum ([question_bank].min_questions in experiments.toml, unchanged). E3 has room for
# up to 40 so the evolution comparison can detect a smaller improvement (notebook 10); gm
# writes as many E3 questions as the material really allows and leaves the rest empty
# (notebook 01 projects ~37 evolution relations). Empty extra rows are optional.
questions_per_stratum = 25
rows_per_stratum = { E3_evolution = 40 }

# --- people -------------------------------------------------------------------------------
# `role = "annotator"` means the person's phase lists drive `afg gold prepare`.
# `role = "maintainer"` means they annotate nothing; `prepare` says so instead of
# producing an empty workspace.

[[annotation.annotators]]
initials = "gv"
name = "Germán Vega"
role = "annotator"
# GitHub login (sin `@`), para asignar issues/pull requests y mostrar el handle en
# `afg gold status`.
github = "Vega-German"
# 120 decisions, 21 candidate pairs in phase 3 (284 decisions, 65 pairs over all three
# phases). Fewer extra duties than raw counts suggest: `gv` also does Tarea C and validates
# the >=100-question bank.
phase3_series = ["IS1004", "IS1006", "IS1009", "TS3003", "ES2002"]

[[annotation.annotators]]
initials = "gm"
name = "Gustavo Martínez"
role = "annotator"
# GitHub login (sin `@`), para asignar issues/pull requests y mostrar el handle en
# `afg gold status`.
github = "gmartinezbMCD"
# 59 decisions, 27 candidate pairs in phase 3 (223 decisions, 71 pairs over all three
# phases) -- 61 decisions fewer than `gv` in phase 3 because `gm` also writes the whole
# question bank (~5 min per question, >=100 questions). TS3009 moved from here to phase 1
# (recalibration, annotated by both). The split balances total hours, not rows.
phase3_series = ["TS3011", "IS1008", "ES2014"]

[[annotation.annotators]]
initials = "jss"
name = "Jason Sepúlveda"
role = "maintainer"
# GitHub login (sin `@`), para asignar issues/pull requests y mostrar el handle en
# `afg gold status`.
github = "jasonssdev"
# Adjudicates the six double-annotated series and writes their adjudication CSVs.
# Annotates nothing, by design.
phase3_series = []
