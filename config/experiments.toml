# Experiment configuration for C1/C2/C3 (thesis section 5.3), the alignment protocol
# (section 5.4), and the question bank (section 5.5).
#
# Thesis section 5.3: the three conditions share the same generative model, the same
# embedding model, the same hardware, and the same context budget. Only the queried
# representation varies. This file is the single source of that shared budget so no
# condition can silently drift from it.

[shared_budget]
generative_model = "qwen3:8b"        # the model `openkos query` answers with (ADR 0006); pin the exact tag before Experiment A/B (5.8)
generative_model_large = "qwen3:32b" # second scale point (H3); an extension, not a committed run -- see docs/avances/03-jss-objetivos.md
embedding_model = "bge-m3"
context_window_tokens = 12288        # openkos num_ctx default (ADR 0006)
max_generation_tokens = 8192         # openkos num_predict default (ADR 0006)
seed = 42                            # openkos leaves seed unset by default: set it in every workspace's openkos.yaml
temperature = 0.1                    # same: openkos leaves temperature unset by default
top_p = 0.9
runs_per_config = 3                  # thesis section 5.8: minimum 3 runs, report mean + dispersion

[retrieval]
answer_limit = 5                     # `--limit` of `openkos query` for C2 and C3 (OpenKOS default, ADR 0006). Kept on purpose: the three conditions share a TEXT budget, not an equal K (ADR 0007). C1 uses [retrieval.c1].k
rrf_k = 60                           # reciprocal rank fusion constant, as in openkos retrieval/fusion.py
# Unweighted RRF over the lexical and dense channels, as in openkos retrieval/fusion.py.

[retrieval.tuning]
# C1 segmentation and answer-K tuning on development data (ADR 0005). Retrieval only: the
# metric is evidence recall (fraction of the reference dialogue acts that reach the model
# after OpenKOS's context budget; the full-chunk recall is reported beside it), so no
# generative model is involved.
# These values and the selection rule are pre-registered: committed before any result is seen.
series = ["ES2015"]                  # development series whose whole meeting set is indexed (D15)
max_chars = [800, 1200, 1600, 2400]  # chunk size cap, characters
overlap_turns = [0, 1]               # turns shared between consecutive chunks
k = [3, 5, 8, 10]                    # chunks sent to the answer prompt
# Total context chars OpenKOS measured for 5 bodies before it bounded the context (issue
# #882); pre-registered and kept as the eligibility filter, although the effective budget in
# v0.5.4 is ~7,400 chars (ADR 0007, amendment). A config is eligible only if
# k * max_chars <= char_budget.
char_budget = 13516
# Winner: the eligible config with the highest mean recall; among eligible configs within
# tie_margin of it, prefer smaller k, then smaller max_chars, then smaller overlap_turns.
tie_margin = 0.02

[retrieval.c1]
# Parameters C1 runs with, chosen by the pre-registered rule above on ES2015 (development
# data, ADR 0005), measuring the recall of the text that reaches the model after OpenKOS's
# context budget (ADR 0007, amendment of 2026-10-15). Result: reports/c1-tuning/resultados.json;
# reasoning: notebook 06 and ADR 0007. A test checks these equal the stored winner. K=5 chunks
# of at most 1200 characters fit the ~7,400-character context OpenKOS v0.5.4 sends, which is
# the same for C1, C2 and C3 by construction.
max_chars = 1200                     # chunk size cap, characters
overlap_turns = 1                    # turns shared between consecutive chunks
k = 5                                # chunks sent to the answer prompt

[alignment]
# Thesis section 5.4: cosine-similarity candidates over (decision object, content) pairs,
# one-to-one matching via the Hungarian algorithm, F1 reported as a curve over tau, never
# a single point.
tau_grid = [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
manual_validation_sample_size = 100  # minimum sample for automatic-vs-manual concordance

[question_bank]
# Thesis section 5.5: four strata, each with at least 25 questions.
strata = ["E1_point_fact", "E2_current_state", "E3_evolution", "E4_unanswerable"]
min_questions = 25

[evaluation]
bootstrap_resamples = 10_000          # thesis section 5.0: every result carries a bootstrap CI
bootstrap_confidence_level = 0.95
human_validation_fraction = 0.20      # thesis section 5.7: >=20% human validation of judged answers

[judge]
# Thesis section 5.7: the judge model MUST be a different family than the extractor to
# avoid self-preference bias (Panickssery et al., 2024).
# Chosen by the calibration on ES2015 (notebook 05, reports/judge-calibration/resultados.json):
# it meets every pre-registered threshold and is the fastest of the candidates that do. A
# different family from the generative model (OpenAI open-weight vs Qwen).
model = "gpt-oss:20b"
must_differ_from_generative_model = true
# Transcript excerpt the judge reads to decide `evidence_supported`: this many speaker turns
# before and after the turns holding the reference dialogue acts (windows that overlap are
# merged). AMI turns are short, so 5 turns each side is roughly one minute of talk: enough to
# see the discussion around a decision (who proposed it, whether it was agreed) without
# flooding the prompt. One value for every candidate, fixed before any result is seen; the
# labelers read the same excerpt.
evidence_window_turns = 5

[judge.calibration]
# Pre-registered acceptance thresholds for choosing the judge model. Fixed BEFORE any
# candidate was run; do not tune them after looking at results. Read by
# `afg.evaluation.judge_calibration`, never repeated in code.
min_kappa_correct = 0.70             # Cohen's kappa vs human labels on `correct`; same bar as the 20% check (06-jss-metodologia)
min_position_consistency = 0.90      # same verdict after swapping reference/answer order
min_seed_consistency = 0.95          # same verdict across all seeds
min_e4_accuracy = 0.80               # accuracy on the E4_unanswerable stratum
min_json_valid_rate = 0.99           # share of outputs that parse and validate
max_verbosity_flip_rate = 0.10       # verdict changes when a wrong answer is padded
series = ["ES2015"]                  # the calibration set draws only from these series
# ES2015 is annotated and adjudicated, so reading questions about it breaks no pending
# annotation. IS1004 (annotated independently in Phase 3, issue #30) and TS3009
# (recalibration not finished) are development series too, but exposing their content
# before those annotations close would break annotator independence. Must stay a subset of
# `development_series` in corpus.toml; the loader fails otherwise.
candidates = [                       # judge models to calibrate, primary first; none is a Qwen or
    "mistral-small3.2:24b",          # Gemma model (openkos families), see notebook 05
    "atla/selene-mini:q8_0",
    "gpt-oss:20b",
]
seeds = [42, 43, 44]                 # seeds for the self-consistency check (3 runs)

[judge.calibration.think]
# Reasoning setting sent to Ollama per candidate; a model that is not listed gets no `think`
# parameter at all, i.e. its own default. Reasoning models (gpt-oss) otherwise think at length
# before the JSON verdict, which would make a run of hundreds of calls impractical, so their
# reasoning is bounded here. gpt-oss only accepts levels ("low", "medium", "high"), not
# `false`; other models accept `true`/`false`. The same value applies to every item of that
# candidate, and it is part of the cache key of its stored result.
"gpt-oss:20b" = "low"

# Bootstrap resamples and confidence level come from [evaluation]; the bootstrap seed from
# [shared_budget].seed.
