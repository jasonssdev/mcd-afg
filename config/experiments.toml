# Experiment configuration for C1/C2/C3 (thesis section 5.3), the alignment protocol
# (section 5.4), and the question bank (section 5.5).
#
# Thesis section 5.3: the three conditions share the same generative model, the same
# embedding model, the same hardware, and the same context budget. Only the queried
# representation varies. This file is the single source of that shared budget so no
# condition can silently drift from it.

[shared_budget]
generative_model = "qwen3:8b"        # placeholder; fix and publish the exact version before Experiment A/B (5.8)
generative_model_large = "qwen3:32b" # second scale point (H3); an extension, not a committed run -- see docs/avances/03-jss-objetivos.md
embedding_model = "bge-m3"
context_window_tokens = 8192
seed = 42
temperature = 0.1
top_p = 0.9
runs_per_config = 3                  # thesis section 5.8: minimum 3 runs, report mean + dispersion

[retrieval]
top_k = 8
hybrid_lexical_weight = 0.5          # RRF fusion weight, lexical channel (BM25)
hybrid_dense_weight = 0.5            # RRF fusion weight, dense channel (bge-m3 / sqlite-vec)

[alignment]
# Thesis section 5.4: cosine-similarity candidates over (decision object, content) pairs,
# one-to-one matching via the Hungarian algorithm, F1 reported as a curve over tau, never
# a single point.
tau_grid = [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
manual_validation_sample_size = 100  # minimum sample for automatic-vs-manual concordance

[question_bank]
# Thesis section 5.5: four strata, each with at least 25 questions.
strata = ["E1_point_fact", "E2_current_state", "E3_evolution", "E4_unanswerable"]
min_questions = 25

[evaluation]
bootstrap_resamples = 10_000          # thesis section 5.0: every result carries a bootstrap CI
bootstrap_confidence_level = 0.95
human_validation_fraction = 0.20      # thesis section 5.7: >=20% human validation of judged answers

[judge]
# Thesis section 5.7: the judge model MUST be a different family than the extractor to
# avoid self-preference bias (Panickssery et al., 2024).
model = ""  # set via AFG_JUDGE_MODEL; left blank here so the config never silently reuses
            # the generative model above.
must_differ_from_generative_model = true
