# Experiment A extension: C2 extraction with hosted models (ADR 0026).
# Kept apart from config/experiments.toml on purpose: that file is hashed by config/freeze.json
# and the formal run `experimento-a-formal` must keep verifying against it.
#
# Every model runs through OpenKOS's `backend: openai-compatible`. The API key is read ONLY from
# the OPENKOS_OPENAI_API_KEY environment variable (one provider per run); it never goes in a file.

[openkos]
required_version = "0.7.3"            # installed apart from the frozen 0.7.0 (ADR 0026, second amendment)
# Executable of the separate 0.7.3 install; override with AFG_HOSTED_OPENKOS_EXECUTABLE.
executable = "data/interim/openkos-0.7.3/bin/openkos"

[shared]
series_partition = "evaluation"       # the eleven evaluation series of config/corpus.toml
runs_per_model = 3                    # same as [shared_budget].runs_per_config
reasoning_effort = "low"              # applied to all six models alike (ADR 0026, decision 5)
max_generation_tokens = 8192          # same ceiling as the baseline
evidence_quote = false                # baseline value; affects concepts, not the decision pass
embedding_base_url = "http://127.0.0.1:11434"  # embeddings stay on the local Ollama
embedding_model = "bge-m3"
send_seed = false                     # hosted providers refuse or ignore seed/temperature
send_temperature = false

[baseline]
run_name = "experimento-a-formal"     # frozen qwen3:8b run, never re-run
model = "qwen3:8b"

[bridge]
# Continuity check, done once on OpenKOS 0.7.2 (local Ollama backend, baseline settings). It is
# kept as historical evidence only: its stored run stays readable by the comparison, but the
# command refuses to run it again because the executable is now 0.7.3 (second amendment, item 3).
run_name = "experimento-a-puente-0-7-2"
openkos_version = "0.7.2"
series = ["ES2002"]
runs = 1

[local_baseline]
# ADR 0026 second amendment: baseline of the same version as the hosted models. Same settings as
# the bridge (OpenKOS 0.7.3 now, Ollama backend, formal seed, temperature and
# transcript_decisions) over the whole evaluation partition. The 16 pairs of the unfinished
# `experimento-a-base-0-7-2` run are historical evidence and are not read by the comparison.
run_name = "experimento-a-base-0-7-3"
model = "qwen3:8b"
series_partition = "evaluation"
runs = 3

[comparison]
tau = 0.70
sensitivity_taus = [0.75, 0.80]
bootstrap_resamples = 10000
bootstrap_seed = 42
family_alpha = 0.05                   # Bonferroni over the models listed below
precision_margin = -0.05              # lower CI bound of the precision difference must not go below

[providers.openai]
base_url = "https://api.openai.com"

[providers.anthropic]
base_url = "https://api.anthropic.com"

[providers.google]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

# label -> provider + model id served by that API. Labels become run names: experimento-a-hosted-<label>.
[models.openai-small]
provider = "openai"
model = "gpt-5-mini"

[models.openai-large]
provider = "openai"
model = "gpt-6-luna"

[models.anthropic-small]
provider = "anthropic"
model = "claude-haiku-5-5"

[models.anthropic-large]
provider = "anthropic"
model = "claude-sonnet-5-5"

[models.google-small]
provider = "google"
model = "gemini-3.8-flash"

[models.google-large]
provider = "google"
model = "gemini-4-argon"

# Public price of each model, in US dollars per million tokens (ADR 0026, second amendment,
# decision 5). They are UNSET on purpose: fill them in, with the date on which they were read and
# the provider's pricing page, BEFORE the pilot. While a model has no [prices.<label>] table its
# cost is reported as "pendiente", never as 0. Cost of a meeting =
#   prompt * input + (total - prompt) * output, per million tokens.
# Uncomment and complete one block per model (all four keys are required):
#
# [prices.openai-small]
# input_usd_per_mtok = <USD per million input tokens>
# output_usd_per_mtok = <USD per million output tokens>
# prices_date = "<YYYY-MM-DD on which the price was read>"
# pricing_url = "<pricing page of the provider>"
#
# (same block for openai-large, anthropic-small, anthropic-large, google-small, google-large)

# Standard (non-batch) list prices read on 2026-11-26. Tiers that this formula cannot apply are
# noted per model: the token line gives totals per ingest, not per call, and no cached-input split.
[prices.openai-small]
input_usd_per_mtok = 0.25
output_usd_per_mtok = 2.00
prices_date = "2026-11-26"
pricing_url = "https://developers.openai.com/api/docs/pricing"

[prices.openai-large]
# Short-context rate (<= 272K input tokens per request); long context is 0.20 / 0.75.
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.50
prices_date = "2026-11-26"
pricing_url = "https://developers.openai.com/api/docs/pricing"

[prices.anthropic-small]
# Rate for prompts up to 100,000 tokens; over that it is 0.50 / 2.50.
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.50
prices_date = "2026-11-26"
pricing_url = "https://platform.claude.com/docs/en/about-claude/pricing"

[prices.anthropic-large]
input_usd_per_mtok = 2.00
output_usd_per_mtok = 10.00
prices_date = "2026-11-26"
pricing_url = "https://platform.claude.com/docs/en/about-claude/pricing"

[prices.google-small]
# Introductory rate through 2026-12-31; 1.50 / 7.50 from 2027-01-01.
input_usd_per_mtok = 0.75
output_usd_per_mtok = 3.75
prices_date = "2026-11-26"
pricing_url = "https://aistudio.google.com/docs/pricing"

[prices.google-large]
# Introductory rate through 2026-11-30; 4.00 / 20.00 from 2026-12-01. The Google runs are planned
# to finish before that date; a run that bills on or after 2026-12-01 needs this table updated.
input_usd_per_mtok = 2.00
output_usd_per_mtok = 10.00
prices_date = "2026-11-26"
pricing_url = "https://aistudio.google.com/docs/pricing"

# Optional cross-check, not a source of the cost: dollars billed per model for its full run, read
# by hand from each provider's dashboard after the run. It is shown next to the computed cost.
# [dashboard_usd]
# openai-small = 0.00
# openai-large = 0.00
# anthropic-small = 0.00
# anthropic-large = 0.00
# google-small = 0.00
# google-large = 0.00
